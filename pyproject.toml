[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinykv"
version = "0.1.0"
description = "A small persistent key/value store with a B+ tree storage engine and write-ahead log"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vishwanathan Tamizharasan" }]
keywords = ["database", "b+ tree", "storage engine", "key-value", "wal"]

[project.scripts]
tinykv = "tinykv.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["tinykv"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
